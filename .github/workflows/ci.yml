# imscribe's gates, on GitHub's runners.
#
#   plain     `make check` with the library switched off (IMSCRIBE_NO_TYPESET=1):
#             lint, types, and the suite with its with-library tests skipping.
#             What imscribe is on a platform imtypeset has no wheel for.
#   typeset   `make check` as it is after `make bootstrap`: imtypeset is a
#             dependency (pyproject.toml), pip installed its wheel from PyPI,
#             and the with-library tests run against it with nothing set.
#   sidecar   ONLY when the workflow is started by hand: the library pair
#             built from imtypeset's source at the ref in imtypeset.ref, the
#             installed wheel taken out, `make check TYPESET=1`. The
#             developer's route, for an imtypeset that is not released.
#
# PYTHON. `plain` and `typeset` run once for each CPython imtypeset has a
# wheel for, 3.11 to 3.14 (fail-fast off: one red version does not hide the
# others); a step after `make bootstrap` holds that ./.venv is the version
# asked for. `sidecar` stays on 3.11: its cache key names the venv's path.
# imtypeset 0.4.1 installs only on 3.11 (H52), so with that pin the 3.12 to
# 3.14 legs stop at `make bootstrap`; that is the pin's, not the matrix's.
#
# EVERY JOB NEEDS imtypeset 0.4.1.192900 FROM PyPI. Since 2026-10-13 `make
# bootstrap` installs it as a dependency, in every job; an index that does not
# have the pinned file stops all three at "make bootstrap", and nothing here
# works around that. It was published that day (PyPI answered 404 for the
# project in the morning, and by 13:50 `pip install imtypeset==0.4.1.192900`
# worked from a developer's machine). A pin moved to a version that is not
# published yet makes this workflow red until it is.
#
# WRITTEN WITHOUT BEING RUN. No session that wrote this file has started it
# on GitHub. What was run instead, and what was not, is listed in
# tests/test_ci_workflow.py's module docstring; a first run that goes red is
# the expected way to find out which of those assumptions was wrong.
#
# Every `run:` below is a command a person can paste into a shell at the top
# of a checkout: none contains a workflow expression. A value that comes from
# another step arrives as an environment variable named in that step's `env:`.
# tests/test_ci_workflow.py holds the file to that, to the make targets and
# variables it names, and to a small subset of YAML (block style only, whole
# line comments only), because the project's virtualenv has no YAML parser.
#
# THE DISPLAY. The tests that open a real window do it two ways:
#
#   the `window` fixture (tests/conftest.py)  runs on DISPLAY when it accepts
#       a connection AND IMSCRIBE_TEST_DISPLAY asks for it (set under `env:`
#       below; without it the fixture prefers an Xvfb of its own, so that a
#       developer's desktop pointer is not in the tests). `xvfb-run` provides
#       the display, and needs no privilege.
#   two files (tests/test_mouse_probe.py, tests/test_example_stream.py)  start
#       their own Xvfb inside a user namespace (`unshare -rm`) whatever
#       DISPLAY is, and SKIP when a namespace cannot be made. Their Xvfb runs
#       with `-nolisten local`: the namespace shares the host's network
#       namespace, so without it the abstract socket of xvfb-run's own `:99`
#       stopped theirs (run 38497533497, 2026-10-14).
#
# So both are arranged, and the second is checked before the gate rather than
# left to a skip nobody reads: Ubuntu 24.04 restricts unprivileged user
# namespaces through AppArmor, and the step "User namespaces" lifts that one
# setting with sudo only when `unshare -rm true` fails without it.
#
# THE HEADERS THE LIBRARY IS COMPILED AGAINST. Nothing below says which, and
# that is the choice: `make typeset-lib` hands the build script a headers
# choice only when IMTYPESET_HEADERS is given (Makefile), and a runner has
# network, so the script decides. From imtypeset's portable-build commit on that is to fetch
# the wheel's own Dear ImGui headers (github.com/pthom/imgui by commit id, and
# one file of pthom/imgui_bundle) and to stop if it cannot; the pair then says
# `headers: fork:<commit>`. No job here asks for stand-in headers. A script
# from before that commit chooses as it always did: the fork when the bundle
# checkout beside it has the submodule, which the step "Fetch what the build
# script reads" does not give it, so stand-in.
#
# That step is what a ref BEFORE that commit needs and cannot build without (its
# script reads the bundle's tag and upstream's docking tag from two local
# repositories). From that commit on the script needs neither: it reads the
# bundle checkout, when there is one, in place of one download, and the Dear
# ImGui clone only for stand-in headers. The step stays while imtypeset.ref
# may name either kind of ref, and can go, with the two variables it feeds
# `make typeset-lib`, once the ref is that commit or later.
#
# The gate's last step before the window does not name the library's file:
# the name is the build's (it differs by platform) and the Makefile reads it.
# `make shot TYPESET=1` stops with "No <library>" when the pair has none.
#
# SOFTWARE GL. No GPU on a runner: Mesa's llvmpipe, selected by the two
# variables under `env:` (the same two scripts/mouse_probe.py::xvfb_command
# sets). The package list is in each job's "System packages" step and is named
# from what the imgui-bundle wheel links (libX11, libXext, libxcb) and what its
# GLFW loads by name at run time (libGLX/libGL, libXrandr, libXinerama,
# libXcursor, libXi, libXrender).

name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "experimental/**"
  pull_request:
    branches:
      - main
      - "experimental/**"

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  LIBGL_ALWAYS_SOFTWARE: "1"
  GALLIUM_DRIVER: llvmpipe
  PYTEST_ADDOPTS: "-rs"
  IMSCRIBE_TEST_DISPLAY: "1"

jobs:
  plain:
    name: "make check (the library switched off), CPython ${{ matrix.python }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - name: "Check out imscribe"
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: "Python from the matrix"
        uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python }}"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: "System packages (a display, software GL, what the wheel loads)"
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            make git xvfb xauth util-linux \
            libgl1 libglx0 libglx-mesa0 libgl1-mesa-dri \
            libx11-6 libxext6 libxcb1 libxrandr2 libxinerama1 libxcursor1 libxi6 libxrender1

      - name: "User namespaces (for the tests that start their own Xvfb)"
        run: |
          unshare -rm true || sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          unshare -rm true

      - name: "make bootstrap"
        run: make bootstrap

      - name: "The venv is the matrix's Python"
        env:
          WANT: "${{ matrix.python }}"
        run: |
          .venv/bin/python -P -c 'import os, sys; got = "%d.%d" % sys.version_info[:2]; sys.exit(0 if got == os.environ["WANT"] else "venv is %s, matrix asked %s" % (got, os.environ["WANT"]))'

      - name: "No library is named, and the switch keeps imscribe from looking for the installed one"
        env:
          IMSCRIBE_NO_TYPESET: "1"
        run: |
          test ! -e ../imtypeset
          test -z "${IMTYPESET_LIBRARY:-}"
          test -z "${IMTYPESET_PYTHON:-}"
          test ! -e build/imtypeset-bundle
          code=0
          .venv/bin/python -P -m imscribe.typesetter || code=$?
          test "$code" = 3

      - name: "A display answers under xvfb-run"
        run: |
          xvfb-run -a -s "-screen 0 1400x1000x24" .venv/bin/python -P -c 'import os, sys; sys.path.insert(0, "tests"); import conftest; sys.exit(0 if conftest.display_is_reachable(os.environ["DISPLAY"]) else "DISPLAY=%s accepts no connection" % os.environ["DISPLAY"])'

      - name: "make check"
        env:
          IMSCRIBE_NO_TYPESET: "1"
        run: xvfb-run -a -s "-screen 0 1400x1000x24" make check

  typeset:
    name: "make check (imtypeset installed from PyPI), CPython ${{ matrix.python }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - name: "Check out imscribe"
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: "Python from the matrix"
        uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python }}"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: "System packages (a display, software GL, what the wheel loads)"
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            make git xvfb xauth util-linux \
            libgl1 libglx0 libglx-mesa0 libgl1-mesa-dri \
            libx11-6 libxext6 libxcb1 libxrandr2 libxinerama1 libxcursor1 libxi6 libxrender1

      - name: "User namespaces (for the tests that start their own Xvfb)"
        run: |
          unshare -rm true || sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          unshare -rm true

      - name: "make bootstrap"
        run: make bootstrap

      - name: "The venv is the matrix's Python"
        env:
          WANT: "${{ matrix.python }}"
        run: |
          .venv/bin/python -P -c 'import os, sys; got = "%d.%d" % sys.version_info[:2]; sys.exit(0 if got == os.environ["WANT"] else "venv is %s, matrix asked %s" % (got, os.environ["WANT"]))'

      - name: "Which imtypeset pip installed, and that it loads with nothing set (exit 0 only then)"
        run: |
          test -z "${IMTYPESET_LIBRARY:-}"
          test -z "${IMTYPESET_PYTHON:-}"
          .venv/bin/python -m pip check
          .venv/bin/python -P -m imscribe.typesetter

      # scripts/shot.py still decides "a library was asked for" by
      # IMTYPESET_LIBRARY (2026-10-13): with the installed wheel and no
      # variable it prints a note that no page will draw, which is no longer
      # true, and a library that did not draw would not fail THIS step. The
      # step before holds that it loads; the gate holds that it draws.
      - name: "One window before the gate (red here: no GL context)"
        run: |
          mkdir -p artifacts
          xvfb-run -a -s "-screen 0 1400x1000x24" make shot ARGS="--out artifacts/ci-document.png"
          test -s artifacts/ci-document.png

      - name: "make check"
        run: xvfb-run -a -s "-screen 0 1400x1000x24" make check

      - name: "Keep the photograph"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "ci-document-py${{ matrix.python }}"
          path: artifacts/ci-document.png
          if-no-files-found: ignore

  sidecar:
    name: "make check TYPESET=1 (the pair built from source; started by hand)"
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: "Check out imscribe"
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: "Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: "System packages (a display, software GL, what the wheel loads, a compiler)"
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            make git xvfb xauth util-linux g++ \
            libgl1 libglx0 libglx-mesa0 libgl1-mesa-dri \
            libx11-6 libxext6 libxcb1 libxrandr2 libxinerama1 libxcursor1 libxi6 libxrender1

      - name: "User namespaces (for the tests that start their own Xvfb)"
        run: |
          unshare -rm true || sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          unshare -rm true

      - name: "make bootstrap"
        run: make bootstrap

      - name: "Take the installed imtypeset out (it reads no variable and would be what loads)"
        run: |
          .venv/bin/python -m pip uninstall -y imtypeset
          .venv/bin/python -P -c 'import importlib.util, sys; sys.exit("an imtypeset distribution is still installed" if importlib.util.find_spec("imtypeset") else 0)'

      - name: "What the pair is: the imtypeset ref, and the wheel it is linked against"
        id: pair
        run: |
          ref="$(sed -n '/^[^#[:space:]]/{p;q;}' imtypeset.ref)"
          wheel="$(.venv/bin/python -P -c 'import imgui_bundle; print(imgui_bundle.__version__)')"
          imgui="$(.venv/bin/python -P -c 'from imgui_bundle import imgui; print(imgui.get_version())')"
          test -n "$ref" && test -n "$wheel" && test -n "$imgui"
          echo "imtypeset $ref; imgui_bundle $wheel; Dear ImGui $imgui"
          { echo "ref=$ref"; echo "wheel=$wheel"; echo "imgui=$imgui"; } >> "${GITHUB_OUTPUT:-/dev/null}"

      - name: "The built pair, from the cache when this ref was already built for this wheel"
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: build/imtypeset-bundle
          key: "imtypeset-pair-${{ runner.os }}-${{ runner.arch }}-py3.11-${{ steps.pair.outputs.ref }}-bundle-${{ steps.pair.outputs.wheel }}-${{ hashFiles('.venv/lib/python3.11/site-packages/imgui_bundle/_imgui_bundle*.so') }}-${{ hashFiles('Makefile') }}"

      - name: "Fetch what a build script from before imtypeset's portable-build commit reads beside it (one commit each, no worktree)"
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          IMGUI_BUNDLE_REPO: https://github.com/pthom/imgui_bundle
          IMGUI_REPO: https://github.com/ocornut/imgui
          WHEEL_VERSION: "${{ steps.pair.outputs.wheel }}"
          IMGUI_VERSION: "${{ steps.pair.outputs.imgui }}"
          CI_DEPS: build/ci-deps
        run: |
          rm -rf "$CI_DEPS"
          mkdir -p "$CI_DEPS"
          git init -q "$CI_DEPS/imgui_bundle"
          git -C "$CI_DEPS/imgui_bundle" fetch -q --depth 1 --no-tags "$IMGUI_BUNDLE_REPO" "refs/tags/v$WHEEL_VERSION:refs/tags/v$WHEEL_VERSION"
          git -C "$CI_DEPS/imgui_bundle" ls-tree "v$WHEEL_VERSION" external/imgui/imgui imgui_bundle_cmake/imgui_bundle_config.h
          git init -q "$CI_DEPS/imgui"
          git -C "$CI_DEPS/imgui" fetch -q --depth 1 --no-tags "$IMGUI_REPO" "refs/tags/v$IMGUI_VERSION-docking:refs/tags/v$IMGUI_VERSION-docking"
          git -C "$CI_DEPS/imgui" ls-tree "v$IMGUI_VERSION-docking" imgui.h imconfig.h

      - name: "make typeset-lib (imtypeset from GitHub at the ref)"
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          PAIR_REF: "${{ steps.pair.outputs.ref }}"
          CI_DEPS: build/ci-deps
        run: |
          make typeset-lib IMTYPESET_REF="$PAIR_REF" \
            IMGUI_BUNDLE_CHECKOUT="$PWD/$CI_DEPS/imgui_bundle" \
            IMTYPESET_IMGUI_CLONE="$PWD/$CI_DEPS/imgui"

      - name: "Cache the pair now, so that a red gate does not cost the next run a rebuild"
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/imtypeset-bundle
          key: "${{ steps.cache.outputs.cache-primary-key }}"

      - name: "Which pair the gate runs against (built now or restored: it must be of this ref)"
        env:
          PAIR_REF: "${{ steps.pair.outputs.ref }}"
        run: |
          cat build/imtypeset-bundle/BUILT-FROM
          grep -qx "ref: $PAIR_REF" build/imtypeset-bundle/BUILT-FROM
          test -f build/imtypeset-bundle/pysnap/imtypeset/__init__.py

      - name: "One window before the gate (red here: no GL context, or the library does not draw)"
        run: |
          mkdir -p artifacts
          xvfb-run -a -s "-screen 0 1400x1000x24" make shot TYPESET=1 ARGS="--out artifacts/ci-document.png"
          test -s artifacts/ci-document.png

      - name: "make check TYPESET=1"
        run: xvfb-run -a -s "-screen 0 1400x1000x24" make check TYPESET=1

      - name: "Keep the photograph"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-document-sidecar
          path: artifacts/ci-document.png
          if-no-files-found: ignore
