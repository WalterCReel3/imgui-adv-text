# macOS on Apple Silicon: imscribe installed with its dependencies, and the
# tests that need no window.
#
# NEVER RUN. Nobody on this project has run anything of imscribe on a Mac, and
# this workflow has not been started. It starts ONLY by hand
# (`workflow_dispatch`): a job that has never passed should not turn a push
# red on the day of a release. Its first run is the finding; make it a push
# trigger once it has been green.
#
# What it waited on, and the answer: H1 of HANDOFF-imtypeset.md (does the
# sidecar work on macOS at all) is answered YES by imtypeset: its probe passed
# on GitHub's macOS arm64 runners, and it publishes a wheel for
# `macosx_14_0_arm64`, CPython 3.11 to 3.14 (its docs/releasing.md, section
# 1). So `make bootstrap` here installs imtypeset from PyPI as it does on
# Linux, and the step after it asks imscribe whether the library loads.
#
# What runs: `make check` -- lint, types and the suite. The tests that open a
# real window SKIP here and say why: the `window` fixture (tests/conftest.py)
# finds no DISPLAY and no Xvfb, and the two files that start their own Xvfb
# need `unshare`, which macOS does not have. Everything that runs Dear ImGui
# frames with no window, and every with-library test of that kind, runs.
#
# Not known, and what the first run will say: whether `make` and the
# Makefile's shell lines work with macOS's tools (BSD sed, cksum, find); how
# many tests skip; whether any test assumes Linux in a way that fails and
# does not skip (imscribe's own audit of that, task L1-MAC of 2026-10-11, was
# to be in docs/status.md); whether text is set in the same places as on
# Linux (the tests hold numbers measured on Linux x86-64).
#
# PYTHON: once for each of CPython 3.11 to 3.14, as ci.yml's two gates (its
# header says why the 3.12 to 3.14 legs stopped at `make bootstrap` while the
# pin was 0.4.1, until 2026-10-14).
#
# EVERY JOB NEEDS imtypeset 0.4.3.192900 FROM PyPI, as in ci.yml (published
# by 2026-10-14, with wheels for macosx_14_0_arm64, CPython 3.11 to 3.14).
#
# Known of imtypeset itself on macOS 14 arm64, by its own notes
# (docs/advtext-swap-status.md there, "Known at v0.4.1"): its wheels' installed
# checks pass; three of its 55 tests failed on its first run there (a scripted
# keyboard-copy test that sent Ctrl where a Mac sends Cmd, a paragraph laid
# out differently under a decimal-comma locale, and 2 of 7,510 glyph boxes
# under Homebrew's FreeType, which the wheel does not use), and its tag
# v0.4.1 is the commit "Correct the four tests that failed on the first macOS
# run". None of that was run by imscribe.

name: "macOS arm64 (by hand; never run)"

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTEST_ADDOPTS: "-rs"

jobs:
  check-macos:
    name: "make check on macOS arm64 (window tests skip), CPython ${{ matrix.python }}"
    runs-on: macos-14
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - name: "Check out imscribe"
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: "Python from the matrix"
        uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python }}"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: "make bootstrap"
        run: make bootstrap

      - name: "The venv is the matrix's Python"
        env:
          WANT: "${{ matrix.python }}"
        run: |
          .venv/bin/python -P -c 'import os, sys; got = "%d.%d" % sys.version_info[:2]; sys.exit(0 if got == os.environ["WANT"] else "venv is %s, matrix asked %s" % (got, os.environ["WANT"]))'

      - name: "Which imtypeset pip installed, and that it loads with nothing set (exit 0 only then)"
        run: |
          .venv/bin/python -m pip check
          .venv/bin/python -P -m imscribe.typesetter

      - name: "make check"
        run: make check
