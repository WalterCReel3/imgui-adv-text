[project]
name = "imscribe"
# The same string as `imscribe.__version__` (`tests/test_dist.py` holds them
# equal), which is where a host reads it at run time and where what the number
# promises is written. `b1`: the first upload to PyPI is a beta, which pip
# installs only when asked (`pip install --pre imscribe`, or `imscribe==0.2.0b1`).
# `make dist` builds the files; `.github/workflows/release.yml` publishes them
# for a pushed tag `v0.2.0b1` and refuses a tag that is not this string.
version = "0.2.0b1"
description = "Markdown, streaming and diff views for Dear ImGui, typeset by imtypeset"
# The project's page on PyPI: short, and true of an installed wheel. README.md
# is the repository's (how the tree is built, tested and measured) and is in
# neither the wheel nor the sdist.
readme = "README-pypi.md"
requires-python = ">=3.11"
# MIT, the licence of Dear ImGui and of Dear ImGui Bundle; the owner's choice
# (2026-10-12: "permissive but compatible with the imgui ecosystem"). The six
# fonts the views set text in are not in this package: they ship in the
# imgui-bundle wheel under their own licences.
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Walter Reel" }]
dependencies = [
    # Dear ImGui, the demo app, and the binary the imtypeset library is for.
    #
    # EXACT, and deliberately (2026-10-11; `.concerns/lead--level-1.md`,
    # decision 1). Everything imscribe draws is drawn by imtypeset, a shared
    # library loaded beside this wheel and linked against this wheel's own
    # extension module: one library is for one wheel binary, and its import
    # gate refuses any other (`imscribe/typesetter.py`). A range here would
    # promise that imscribe works on versions its library was never built for,
    # and the failure would arrive at import of the library, as a page that
    # draws one line, and not at install. So an upgrade is three acts and never
    # a side effect of `pip install -U`: change this pin, rebuild the library
    # against the new wheel (`make typeset-lib`), run `make check TYPESET=1`.
    #
    # 1.92.900 is the version every measurement in this tree was taken on.
    # `tests/test_makefile_env.py` holds the pin to `==` one version and the
    # installed wheel to that version.
    #
    # What the pin costs: imscribe cannot be installed beside anything that
    # needs another imgui-bundle. That is true of the pairing whatever this
    # line says; the pin says it at install.
    #
    "imgui-bundle==1.92.900",
    # The library that draws, since 2026-10-13 a dependency like any other
    # (until then it had no distribution: HANDOFF-imtypeset.md, H3).
    #
    # BOTH PINS MOVE TOGETHER. An imtypeset wheel is built for one
    # imgui-bundle and its version says which: the fourth number, 192900, is
    # 1.92.900 again, and that wheel itself requires `imgui-bundle==1.92.900`.
    # Changing one line without the other is an install that cannot resolve.
    # `tests/test_ci_workflow.py` holds the two to each other and the marker to
    # the text below.
    #
    # The marker is where imtypeset HAS wheels, copied from its
    # docs/releasing.md, section 5 (CPython 3.11 to 3.14; Linux x86-64 with
    # glibc 2.28 or later, macOS 14 or later on arm64). Everywhere else it is
    # false, pip leaves imtypeset out and `pip install imscribe` still
    # succeeds: `import imtypeset` then fails, `imscribe.typesetter.kind()`
    # is `not-installed`, and a view says so and draws nothing. What no marker
    # can say (the same section): musl (Alpine) is Linux on x86-64, has no
    # wheel, and the install FAILS there at this line.
    #
    # Not an extra (the lead's decision, 2026-10-13): there is no other
    # renderer, so imscribe without it draws nothing.
    "imtypeset==0.4.1.192900; python_version >= '3.11' and python_version < '3.15' and ((sys_platform == 'linux' and platform_machine == 'x86_64') or (sys_platform == 'darwin' and platform_machine == 'arm64'))",
    # Block and inline parsing for the markdown litmus test. Only the parser is
    # used -- token stream in, our own box tree out. Nothing here renders HTML.
    "markdown-it-py>=3.0",
    # Every glyph advance, kern and OpenType MATH constant comes from here
    # rather than from ImGui: see docs/decisions.md, "Metrics come from
    # fontTools". This is a runtime dependency, not a dev tool.
    "fonttools>=4.50",
]

[project.urls]
# Renamed on GitHub on 2026-10-13 (it was imgui-adv-text; GitHub redirects the old URL).
Repository = "https://github.com/WalterCReel3/imscribe"

[project.optional-dependencies]
# The ruff floor is deliberately recent: the lint rule set shifts between minor
# versions, and an older ruff passes code that a newer one rejects. A gate whose
# strictness depends on what happens to be installed is a latent failure.
dev = [
    "pytest>=8.0",
    "black>=24.1",
    "mypy>=1.11",
    "ruff>=0.16",
    # `make shot`. hello_imgui hands the framebuffer back as a nanobind
    # ndarray, so `final_app_window_screenshot()` cannot return at all without
    # numpy -- and it does not fail as an ImportError. It raises
    # `TypeError: could not export nanobind::ndarray: No module named 'numpy'`,
    # which reads like a binding bug rather than a missing package. That is the
    # same failure mode already written up at
    # imscribe/ui/document_view.py:306-312 for a different call, and it cost
    # time once here already. Dev-only: nothing imscribe imports uses numpy, and
    # a layout engine that made every installer take it would be paying for a
    # screenshot script.
    "numpy>=1.24",
    # `make dist`. The front end and the backend named under [build-system],
    # installed so that the build runs without network and without an isolated
    # environment (`python -m build --no-isolation`): what builds an artefact
    # is then what `./.venv` holds, and `dist/BUILT-FROM` records the versions.
    # Added 2026-10-12 by a session with no index; installed and run for the
    # first time on 2026-10-13 (build 1.6.1, hatchling 1.32.4).
    "build>=1.2",
    "hatchling>=1.27",
    # `twine check dist/*`: whether PyPI will render the description. The
    # publishing action runs the same check before it uploads.
    "twine>=6.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

# The wheel is `imscribe/` and its metadata: no tests, no `demo/` sources, no
# examples, no handoff files. `imscribe/py.typed` goes with the package. The
# demo application's pages are inside the package (`imscribe.ui.pages`) and say
# so themselves when `demo/` is absent. `scripts/make_dist.py` refuses a wheel
# that holds anything else.
[tool.hatch.build.targets.wheel]
packages = ["imscribe"]

# The sdist is what BUILDS and DESCRIBES the package and nothing else (the
# lead's decision, 2026-10-13, before the first upload; the owner may reverse
# it): the package, this file, the licence, and the page PyPI shows. Until
# then it also carried tests/, docs/, demo/, examples/, scripts/, .github/,
# the Makefile, README.md and the two handoff files: working notes, some
# naming paths on the machine they were written on, in a file whose name PyPI
# never lets anyone replace. All of that is in the repository, which the page
# links. So the suite cannot be run from an unpacked sdist, and was never
# shown to (its sources include `demo/`, which a build of the wheel does not
# need).
#
# Listed explicitly rather than inferred: hatchling falls back to parsing
# .gitignore when not told otherwise, which silently couples what ships to what
# is ignored. Hatchling adds three members whatever this list says: PKG-INFO,
# and `.gitignore` where the source has one (measured: it is in the sdist of a
# `git archive` export). `scripts/make_dist.py` refuses an sdist holding
# anything but these, and `tests/test_dist.py` holds this list to that script.
[tool.hatch.build.targets.sdist]
include = [
    "/imscribe",
    "/pyproject.toml",
    "/LICENSE",
    # The `readme` above: the build fails without it.
    "/README-pypi.md",
]
exclude = ["**/__pycache__", "**/*.pyc"]

# black owns formatting (docs/decisions.md, "Shape of the code"); ruff is
# lint-only here, so its formatter is never invoked and the two cannot disagree
# about the same file.
[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
# The floor from `requires-python`, not whatever the interpreter in ./.venv
# happens to be. Typechecking against the oldest supported version is what
# catches a 3.12-only idiom before it reaches a Debian 12 box, whose system
# Python is 3.11.
python_version = "3.11"
strict = true
# Neither imgui-bundle nor fontTools ships stubs this checker will accept as
# complete, and vendoring stubs for either is a project of its own.
ignore_missing_imports = true

[[tool.mypy.overrides]]
# imgui_bundle's stubs type draw-list point arguments as invariant containers,
# so a correct list[ImVec2] is rejected and the call needs `# type: ignore`.
# Whether any given one of those ignores is redundant depends on the stub
# version installed, so the redundancy warning fires on correct code here.
# Confined to the two modules that touch ImGui rather than relaxed globally.
module = ["imscribe.backends.imgui_draw", "imscribe.ui.*"]
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
